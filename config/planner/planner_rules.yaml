# ====================== THRESHOLDS ======================
thresholds:
    n_threshold: 30
    m_min: 0.55                    # было 0.64 — теперь правила срабатывают раньше
    t_low: 0.7
    t_high: 1.3
    dp_critical: 0.35              # было 0.45 — теперь модель чаще видит ошибки
    attempts_critical: 2.5
    e_fresh_min: 0.55
    time_ref:
      knowledge: 30
      comprehension: 45
      application: 90
      analysis: 120
      synthesis: 180
      evaluation: 180

# ====================== RULES ======================
rules:
  - id: "rule_complexity_high"
    condition: "m_term < m_min and t_ratio > t_high"
    priority: 1
    weight: 1.3
    directive:
      action: "decompose"
      target: "theoretical_block"
      strategy: "Scaffolding"
      insight: "Разбить объяснение на 4–6 мелких шагов с отдельными заголовками."

  - id: "rule_misconception_dominant"
    condition: "m_term < m_min and max_d_p > dp_critical"
    priority: 2
    weight: 1.5
    directive:
      action: "contrast"
      target: "assessment_block"
      strategy: "Error_Augmentation"
      insight: "Обязательно добавить таблицу 'Правильный подход vs Типичная ошибка' + минимум 2 контр-примера."

  - id: "rule_low_mastery_normal_time"
    condition: "m_term < m_min and 0.8 <= t_ratio <= 1.2"
    priority: 3
    weight: 1.2
    directive:
      action: "reinforce"
      target: "examples_block"
      strategy: "Drill_and_Practice"
      insight: "Добавить пошаговый чек-лист решения + 2 дополнительных примера разной сложности."

  - id: "rule_stuck_pattern"
    condition: "m_term < m_min and attempts > attempts_critical"
    priority: 4
    weight: 1.4
    directive:
      action: "guide"
      target: "hints_layer"
      strategy: "Step_by_step_hinting"
      insight: "Вставить визуализацию (график или блок-схему) + многоуровневые подсказки."

# ====================== GLOBAL ======================
global:
  conflict_resolution: "merge_all"
  max_directives_per_iteration: 3
  use_e_fresh_only: true

# ====================== FALLBACK ======================
fallback_rule:
  id: "rule_generic"
  condition: "always"
  priority: 5
  directive:
    action: "review"
    target: "full_content"
    strategy: "General_Clarity"
    insight: "Добавить таблицу сравнения правильного и ошибочного подхода + минимум один контр-пример."
