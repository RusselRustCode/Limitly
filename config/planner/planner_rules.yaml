# ====================== THRESHOLDS ======================
# Все пороговые значения вынесены в отдельную секцию.
# Теперь их можно менять без правки кода — преподаватель или аналитик просто редактирует файл.

thresholds: 
    m_min: 0.64 # минимально приемлемый уровень освоения термина (M_term)
    t_low: 0.7 # нижний порог временного коэффициента
    t_high: 1.3 # верхний порог
    dp_critical: 0.45 # критический вес паттерна ошибки (D_p)
    attempts_critical: 2.5 # среднее количество попыток, после которого студент "застрял"
    e_fresh_min: 0.55    # минимальная эффективность на свежей группе (E_fresh)


# ====================== RULES ======================
# Правила сортируются по priority (1 — самое важное).
# Можно одновременно сработать несколько правил — дальше смотрим conflict_resolution.
rules:
  - id: "rule_complexity_high"
    condition: "m_term < thresholds.m_min and t_ratio > thresholds.t_high"
    priority: 1
    weight: 1.0
    directive:
      action: "DECOMPOSE"
      target: "theoretical_block"
      strategy: "Scaffolding"
      insight: "..."
    required_for: ["E_fresh"]

  - id: "rule_misconception_dominant"
    condition: "m_term < thresholds.m_min and d_p > thresholds.dp_critical"
    priority: 2
    weight: 1.2
    directive:
      action: "CONTRAST"
      target: "assessment_block"
      strategy: "Error_Augmentation"
      insight: "Обнаружен устойчивый паттерн ошибки. Нужно явно противопоставить верный алгоритм и ошибочный с помощью контр-примеров."
    error_type_filter: ["Conceptual", "Procedural"]

  - id: "rule_low_mastery_normal_time"
    condition: "m_term < thresholds.m_min and 0.8 <= t_ratio <= 1.2"
    priority: 3
    weight: 1.0
    directive:
      action: "REINFORCE"
      target: "examples_block"
      strategy: "Drill_and_Practice"
      insight: "Время в норме, но результат низкий. Добавить больше разобранных примеров и вариаций для механического закрепления."


  - id: "rule_stuck_pattern"
    condition: "m_term < thresholds.m_min and attempts > thresholds.attempts_critical"
    priority: 4
    weight: 1.1
    directive:
      action: "GUIDE"
      target: "hints_layer"
      strategy: "Step_by_step_hinting"
      insight: "Высокое число попыток — студенты теряют путь решения. Добавить многоуровневые подсказки (от общего к конкретному)."

# ====================== GLOBAL SETTINGS ======================
# Как обрабатывать конфликты и сколько директив отдавать LLM за раз
global:
  conflict_resolution: "merge_all"          # варианты: "top_k_by_priority", "merge_all", "llm_decide"
  max_directives_per_iteration: 3
  min_confidence: 0.6                       # если вес правила ниже — игнорируем
  use_e_fresh_only: true

# ====================== FALLBACK ======================
# Если ничего не подошло, т.е. очень низкое качество, но без явного паттерна
fallback_rule:
  id: "rule_generic"
  condition: "always"
  priority: 999
  directive:
    action: "REVIEW"
    target: "full_content"
    strategy: "General_Clarity"
    insight: "Общее низкое освоение без явного паттерна. Провести полный ревью всего артефакта."
