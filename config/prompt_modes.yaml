# Конфигурация режимов системных промптов (Full/Min)
# Full — полная роль + профиль (педагогический подход)
# Min — минимальная роль или её отсутствие (максимальная точность)

prompt_modes:
  # Темы — нужна структура курса и педагогический взгляд
  topics:
    mode: "full"
    reason: "Нужна структура курса и педагогический взгляд"
  
  # Термины — зависит от сложности, по умолчанию Full
  terms:
    mode: "full"
    reason: "По умолчанию Full для создания контекста обучения"
  
  # Объяснения — главная педагогическая задача
  explanation:
    mode: "full"
    reason: "Главная педагогическая задача — нужен экспертный взгляд"
  
  # Проблемные примеры — критически важна точность решения
  problem_example:
    mode: "min"
    reason: "Критически важна точность решения и шагов"
  
  # Тесты — максимальная точность ответов и дистракторов
  test:
    mode: "min"
    reason: "Максимальная точность ответов и дистракторов"

# Глобальные настройки
defaults:
  fallback_mode: "full"  # Режим по умолчанию, если тип не найден
  allow_override: true   # Разрешить переопределение режима через API
